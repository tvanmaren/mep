# @provisional — stranger extract + slice-boundary litmus
name: stranger
on:
  push:
  pull_request:
jobs:
  run-stranger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install foss test deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep jq
      - name: stranger suite
        run: bash tools/mep/test/run-stranger.sh
      - name: resolver golden matrix
        run: bash tools/mep/test/run-golden-matrix.sh
      - name: slice-boundary litmus
        run: bash scripts/litmus/slice-boundary.sh --executor stub
